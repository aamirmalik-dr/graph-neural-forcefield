# Main benchmark: message-passing network vs compact ACSF network vs ridge,
# all on identical training frames and the same optimizer budget. Both nets
# get the same learning-rate grid (short validation screen, then a full run
# at the winner), and the ridge alpha is tuned on the validation split.
holdout_compositions: [Ti2ZrNb, TiZrNb2]
split_seed: 0
mpnn:
  hidden: 48
  n_blocks: 3
  n_rbf: 24
  cutoff: 5.0
acsf_hidden: [32, 32]
ridge_alphas: [1.0e-10, 1.0e-8, 1.0e-6, 1.0e-4, 1.0e-2]
lr_grid: [1.0e-3, 3.0e-3]
screen_epochs: 15
train:
  epochs: 80
  batch_size: 24
  force_weight: 0.1
  weight_decay: 0.0
  val_every: 5
  seed: 0
timing_repeats: 20
