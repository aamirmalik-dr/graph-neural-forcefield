# Data-efficiency curves (the hero figure): test error versus training-set
# size for all three models at matched per-size budget. Training subsets are
# drawn from whole training groups (never partial batches) so every point
# stays leakage-safe; the same subsets are used for every model.
holdout_compositions: [Ti2ZrNb, TiZrNb2]
split_seed: 0
sizes: [100, 200, 400, 800, all]
subset_seed: 0
mpnn:
  hidden: 48
  n_blocks: 3
  n_rbf: 24
  cutoff: 5.0
acsf_hidden: [32, 32]
ridge_alphas: [1.0e-10, 1.0e-8, 1.0e-6, 1.0e-4, 1.0e-2]
train:
  epochs: 80
  batch_size: 24
  force_weight: 0.1
  val_every: 5
  seed: 0
