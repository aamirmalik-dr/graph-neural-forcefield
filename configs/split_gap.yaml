# Split-protocol control, computed once: the leakage-safe group split versus
# the optimistic random-frame split, three seeds each, for BOTH networks.
# The descriptor net serves as internal control (the sibling repo measured a
# large random-frame optimism for this architecture); the random-frame
# numbers are reported ONLY to show the gap, never as model quality.
holdout_compositions: [Ti2ZrNb, TiZrNb2]
split_seeds: [0, 1, 2]
models: [mpnn, acsf_net]
mpnn:
  hidden: 48
  n_blocks: 3
  n_rbf: 24
  cutoff: 5.0
acsf_hidden: [32, 32]
train:
  epochs: 80
  batch_size: 24
  force_weight: 0.1
  val_every: 5
  seed: 0
